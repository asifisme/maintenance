{% extends 'base.html' %}
{% block title %}{{ action }} Component Preset{% endblock %}
{% block content %}
    <section class="bg-[var(--bg-color)] text-[var(--text-color)] min-h-screen p-4">
        <div class="bg-white rounded-lg p-6 shadow-sm ring-1 ring-[var(--border-color)] max-w-2xl mx-auto">
            <h2 class="text-xl font-bold mb-4">{{ action }} Component Preset</h2>
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block mb-1 font-semibold text-sm">Equipment Type <span class="text-red-500">*</span></label>
                    <select name="equipment_type"
                            class="w-full border rounded p-2 select2-items text-gray-900 bg-white"
                            required>
                        <option value="">Select Equipment Type</option>
                        {% for et in equipment_types %}
                            <option value="{{ et.id }}"
                                    {% if obj.equipment_type_id == et.id %}selected{% endif %}>{{ et.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block mb-1 font-semibold text-sm">Name <span class="text-red-500">*</span></label>
                    <input type="text"
                           name="name"
                           value="{{ obj.name|default:'' }}"
                           class="w-full border rounded p-2 text-gray-900 bg-white"
                           required
                           placeholder="e.g. Compressor">
                </div>
                <div>
                    <label class="block mb-1 font-semibold text-sm">Description</label>
                    <textarea name="description"
                              rows="4"
                              class="w-full border rounded p-2 text-gray-900 bg-white"
                              placeholder="Provide a brief description...">{{ obj.description|default:'' }}</textarea>
                </div>
                <div class="pt-4 flex gap-3">
                    <button type="submit"
                            class="h-11 px-6 rounded-md bg-[var(--primary-color)] text-white font-semibold">Save</button>
                    <a href="{% url 'backend:equipment_component_preset_list' %}"
                       class="h-11 px-6 grid place-items-center border rounded-md font-semibold text-gray-700 bg-white hover:bg-gray-50">Cancel</a>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
{% block extra_js %}
    <script>
  $(document).ready(function () {
    $('.select2-items').select2();
  });
    </script>
{% endblock %}
