{% extends 'base.html' %}
{% block title %}Add Technician{% endblock %}
{% block content %}
    <section class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans">
        <div class="max-w-3xl mx-auto">
            <!-- Header Section -->
            <div class="flex items-center gap-4 mb-8">
                <a href="{% url 'backend:technician_list' %}"
                   class="text-gray-600 hover:text-gray-900 bg-white p-2.5 rounded-xl border border-gray-300 shadow-sm transition hover:shadow-md">
                    <svg width="20"
                         height="20"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2.5"
                         stroke-linecap="round"
                         stroke-linejoin="round">
                        <path d="M15 18l-6-6 6-6" />
                    </svg>
                </a>
                <div>
                    <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Add Technician</h2>
                    <p class="text-sm text-gray-500 mt-0.5">Register a new technician profile in the system.</p>
                </div>
            </div>
            <!-- Form Card Container -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200/80 overflow-hidden">
                <form method="POST" class="p-6 md:p-8 space-y-6">
                    {% csrf_token %}
                    <!-- Name Fields -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-800 mb-2">First Name</label>
                            <input type="text"
                                   name="first_name"
                                   required
                                   class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" />
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-800 mb-2">Last Name</label>
                            <input type="text"
                                   name="last_name"
                                   required
                                   class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" />
                        </div>
                    </div>
                    <!-- Email Field -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-800 mb-2">Email Address</label>
                        <input type="email"
                               name="email"
                               required
                               class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm"
                               placeholder="technician@example.com" />
                    </div>
                    <!-- Phone Number Field -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-800 mb-2">Phone Number</label>
                        <input type="text"
                               name="phone_number"
                               required
                               class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm"
                               placeholder="e.g. +1 (234) 567-890" />
                    </div>
                    <!-- Bio Field -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-800 mb-2">About / Bio</label>
                        <textarea name="about"
                                  rows="4"
                                  class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm resize-none"
                                  placeholder="Describe skills, specializations, certifications, etc..."></textarea>
                    </div>
                    <!-- Action Buttons -->
                    <div class="pt-6 flex justify-end gap-3 border-t border-gray-100">
                        <a href="{% url 'backend:technician_list' %}"
                           class="px-5 py-2.5 text-sm font-semibold text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 hover:text-gray-900 transition shadow-sm">
                            Cancel
                        </a>
                        <button type="submit"
                                class="px-5 py-2.5 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 active:bg-blue-800 transition shadow-sm shadow-blue-500/10">
                            Save Technician
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>
{% endblock %}
