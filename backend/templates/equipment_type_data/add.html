{% extends 'base.html' %}
{% block title %}Add Equipment Type Data{% endblock %}
{% block content %}
    <section class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans">
        <div class="max-w-3xl mx-auto">
            <div class="flex items-center gap-4 mb-6">
                <a href="{% url 'backend:equipment_type_data_list' %}"
                   class="text-gray-600 hover:text-gray-900">
                    <svg width="24"
                         height="24"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">
                        <path d="M15 18l-6-6 6-6" />
                    </svg>
                </a>
                <h2 class="text-2xl font-bold text-gray-900">Add Equipment Type Data</h2>
            </div>
            <form method="post"
                  class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                {% csrf_token %}
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Equipment Type <span class="text-red-500">*</span></label>
                    <select name="equipment_type_id"
                            class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none"
                            required>
                        <option value="">Select Equipment Type</option>
                        {% for t in equipment_types %}
                            <option value="{{ t.id }}">{{ t.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Field Name <span class="text-red-500">*</span></label>
                        <input type="text"
                               name="field_name"
                               class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none"
                               required
                               placeholder="e.g. Lift Speed">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Field Type <span class="text-red-500">*</span></label>
                        <select name="field_type"
                                class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none"
                                required>
                            <option value="text">Text</option>
                            <option value="number">Number</option>
                            <option value="date">Date</option>
                            <option value="boolean">Boolean</option>
                        </select>
                    </div>
                </div>
                <div class="mb-6">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox"
                               name="is_required"
                               value="True"
                               class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                        <span class="text-sm font-medium text-gray-900">Is Required Field</span>
                    </label>
                </div>
                <div class="flex items-center gap-4 mt-6">
                    <button type="submit"
                            class="bg-[#3B5998] hover:bg-blue-800 text-white font-semibold py-2.5 px-6 rounded-lg transition duration-200">Save</button>
                    <a href="{% url 'backend:equipment_type_data_list' %}"
                       class="bg-white border border-gray-200 text-gray-700 font-semibold py-2.5 px-6 rounded-lg transition duration-200 hover:bg-gray-50">Cancel</a>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
{% block extra_js %}
    <script>
$(document).ready(function () {
$('.select2-items').select2();
});
<script>
{% endblock %}
