<script>
    // State storage
    let currentStep = 1;
    let addedEquipments = [];

    // Step Switching Logic
    function goToStep(step) {
        currentStep = step;

        // Toggle Views
        $('#stepSection1').toggleClass('hidden', step !== 1);
        $('#stepSection2').toggleClass('hidden', step !== 2);
        $('#stepSection3').toggleClass('hidden', step !== 3);

        // Update Dynamic Titles
        const titles = {
            1: 'Add Building',
            2: 'Add Equipment',
            3: 'Review & Save'
        };
        $('#wizardStepTitle').text(titles[step]);

        // Update Tab Button Styles to match exact Figma pill inspect (both active & inactive have 1px solid #EAEAEA)
        for (let i = 1; i <= 3; i++) {
            const $btn = $(`#tabBtn${i}`);
            if (i === step) {
                $btn.attr('class', 'tab-pill-active');
            } else {
                $btn.attr('class', 'tab-pill-inactive');
            }
        }

        // When switching to Review (Step 3), refresh summary
        if (step === 3) {
            updateReviewSummary();
        }

        // Scroll smoothly to top of card
        window.scrollTo({ top: 80, behavior: 'smooth' });
    }

    function validateStep1() {
        let isValid = true;
        let firstInvalid = null;
        let firstMsg = '';

        $('.form-input-field, .form-select-field, .form-textarea-field').removeClass('input-error');
        $('.field-error-text').remove();

        function setError($field, msg) {
            $field.addClass('input-error');
            const $wrapper = $field.closest('div');
            if (!$wrapper.find('.field-error-text').length) {
                $wrapper.append(`<span class="field-error-text text-[12px] text-[#D93025] font-medium mt-1 block">${msg}</span>`);
            }
            if (!firstInvalid) {
                firstInvalid = $field;
                firstMsg = msg;
            }
            isValid = false;
        }

        const bldId = $('#inputBuildingId').val().trim();
        if (!bldId) {
            setError($('#inputBuildingId'), 'Building ID is required.');
        }

        const name = $('#inputBuildingName').val().trim();
        if (!name) {
            setError($('#inputBuildingName'), 'Building Name is required.');
        }

        const estDate = $('#inputEstDate').val().trim();
        if (!estDate) {
            setError($('#inputEstDate'), 'Establishment Date is required.');
        }

        const divId = $('#selectedDivisionId').val();
        if (!divId) {
            setError($('#divisionSearchInput'), 'Division is required.');
        }

        const subId = $('#selectedSubdivisionId').val();
        if (!$('#subdivisionSearchInput').prop('disabled') && !subId) {
            setError($('#subdivisionSearchInput'), 'Subdivision is required.');
        }

        const secId = $('#selectedSectionId').val();
        if (!$('#sectionSearchInput').prop('disabled') && !secId) {
            setError($('#sectionSearchInput'), 'Section is required.');
        }

        const addr = $('#inputAddress').val().trim();
        if (!addr) {
            setError($('#inputAddress'), 'Physical Address is required.');
        }

        if (!isValid && firstInvalid) {
            firstInvalid.focus();
            showNotificationToast(firstMsg, true);
        }

        return isValid;
    }

    function validateAndGoToStep(targetStep) {
        if (targetStep === 1) {
            goToStep(1);
            return;
        }

        if (targetStep === 2 || targetStep === 3) {
            if (!validateStep1()) {
                return; // Blocked: Required fields in Step 1 must be filled
            }
        }

        goToStep(targetStep);
    }

    // Clear input-error when user enters data
    $(document).on('input change', '.form-input-field, .form-select-field, .form-textarea-field', function() {
        if ($(this).val()) {
            $(this).removeClass('input-error');
            $(this).closest('div').find('.field-error-text').remove();
        }
    });

    // ─────────────────────────────────────────────────────────────────────────
    // TOAST NOTIFICATION
    // ─────────────────────────────────────────────────────────────────────────
    function showNotificationToast(msg, isError = false) {
        $('.custom-notification-toast').remove();
        const bgClass = isError ? 'bg-[#D93025]' : 'bg-[#0B7A44]';
        const iconSvg = isError
            ? `<svg class="w-4 h-4 shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`
            : `<svg class="w-4 h-4 shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

        const $toast = $(`
            <div class="custom-notification-toast fixed bottom-6 right-6 z-50 ${bgClass} text-white px-4 py-3 rounded-[10px] shadow-xl flex items-center gap-2.5 text-[13.5px] font-semibold animate-in fade-in duration-150">
                ${iconSvg}
                <span>${msg}</span>
            </div>
        `);
        $('body').append($toast);
        setTimeout(function() {
            $toast.fadeOut(300, function() { $(this).remove(); });
        }, 3500);
    }

    // ─────────────────────────────────────────────────────────────────────────
    // DIVISION, SUBDIVISION & SECTION SEARCH & QUICK CREATE
    // ─────────────────────────────────────────────────────────────────────────
    $(document).ready(function() {
        const $searchInput = $('#divisionSearchInput');
        const $dropdown = $('#divisionDropdown');
        const $optionsCard = $('#divisionOptionsCard');
        const $optionsList = $('#divisionOptionsList');
        const $createBox = $('#divisionCreateBox');
        const $createLabel = $('#createDivisionNameLabel');
        const $clearBtn = $('#btnClearDivision');
        const $selectedId = $('#selectedDivisionId');

        function filterDivisions(query) {
            const q = query.toLowerCase().trim();
            let exactMatchFound = false;
            let matchCount = 0;

            $optionsList.find('.division-option').each(function() {
                const name = $(this).data('name').toString();
                const nameLower = name.toLowerCase();

                if (nameLower === q) {
                    exactMatchFound = true;
                }

                if (!q || nameLower.includes(q)) {
                    $(this).removeClass('hidden');
                    matchCount++;
                } else {
                    $(this).addClass('hidden');
                }
            });

            if (!q) {
                $optionsCard.removeClass('hidden');
                $optionsList.find('.division-option').removeClass('hidden');
                $createBox.addClass('hidden');
                return;
            }

            if (matchCount === 0) {
                $optionsList.find('.division-option').removeClass('hidden');
                $optionsCard.removeClass('hidden');
                $createBox.removeClass('hidden');
                $createLabel.text(query.trim());
            } else if (!exactMatchFound) {
                $optionsCard.removeClass('hidden');
                $createBox.removeClass('hidden');
                $createLabel.text(query.trim());
            } else {
                $optionsCard.removeClass('hidden');
                $createBox.addClass('hidden');
            }
        }

        $searchInput.on('focus input click', function() {
            const val = $(this).val();
            filterDivisions(val);
            $('#divisionControlWrapper').addClass('z-50');
            $dropdown.removeClass('hidden');
            $clearBtn.toggleClass('hidden', !val);
        });

        // Keyboard Enter on Division Input
        $searchInput.on('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!$createBox.hasClass('hidden')) {
                    $('#btnQuickCreateDivision').trigger('click');
                } else {
                    const $first = $optionsList.find('.division-option:not(.hidden)').first();
                    if ($first.length) {
                        $first.trigger('click');
                    }
                }
            }
        });

        $(document).on('click', function(e) {
            if (!$(e.target).closest('#divisionControlWrapper').length) {
                $dropdown.addClass('hidden');
                $('#divisionControlWrapper').removeClass('z-50');
            }
        });

        // Click Option
        $(document).on('click', '.division-option', function(e) {
            e.stopPropagation();
            const id = $(this).data('id');
            const name = $(this).data('name');
            selectDivision(id, name);
        });

        $clearBtn.on('click', function(e) {
            e.stopPropagation();
            $searchInput.val('').focus();
            $selectedId.val('');
            $clearBtn.addClass('hidden');
            filterDivisions('');
            $subSearchInput.val('').prop('disabled', true).attr('placeholder', 'Select a division first');
            $selectedSubId.val('');
            $subClearBtn.addClass('hidden');
            $subOptionsList.html('<p class="text-[12.5px] text-[#9D9C9A] p-2 text-center">Select a division first</p>');
            $subCreateBox.addClass('hidden');
            // Reset Section
            $secSearchInput.val('').prop('disabled', true).attr('placeholder', 'Select a subdivision first');
            $selectedSecId.val('');
            $secClearBtn.addClass('hidden');
            $secOptionsList.html('<p class="text-[12.5px] text-[#9D9C9A] p-2 text-center">Select a subdivision first</p>');
            $secCreateBox.addClass('hidden');
        });

        function selectDivision(id, name) {
            $searchInput.val(name);
            $selectedId.val(id);
            $dropdown.addClass('hidden');
            $('#divisionControlWrapper').removeClass('z-50');
            $clearBtn.removeClass('hidden');
            $searchInput.removeClass('input-error');
            $searchInput.closest('div').find('.field-error-text').remove();
            loadSubdivisions(id);
        }

        // Quick Create Division via AJAX
        $('#btnQuickCreateDivision').on('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const newName = $createLabel.text().trim() || $searchInput.val().trim();
            if (!newName) return;

            const $btn = $(this);
            const originalHtml = $btn.html();
            $btn.prop('disabled', true).html(`
                <svg class="animate-spin w-4 h-4 text-[#0B7A44]" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                <span>Creating "${newName}"...</span>
            `);

            $.ajax({
                url: "{% url 'backend:quick_create_division' %}",
                method: "POST",
                data: {
                    name: newName,
                    csrfmiddlewaretoken: '{{ csrf_token }}'
                },
                success: function(resp) {
                    $btn.prop('disabled', false).html(originalHtml);
                    if (resp.success) {
                        const $existing = $optionsList.find(`.division-option[data-id="${resp.id}"]`);
                        if (!$existing.length) {
                            const newOption = `<div class="division-option px-3.5 py-2.5 text-[13.5px] text-[#4A4947] bg-[#F8F8F8] hover:bg-[#EFEFEF] hover:text-[#2B2823] rounded-[9px] cursor-pointer font-medium transition-colors" data-id="${resp.id}" data-name="${resp.name}">${resp.name}</div>`;
                            $optionsList.prepend(newOption);
                        }
                        selectDivision(resp.id, resp.name);
                        showNotificationToast(`Division "${resp.name}" created and selected!`);
                    } else {
                        alert(resp.error || 'Error creating division.');
                    }
                },
                error: function(err) {
                    $btn.prop('disabled', false).html(originalHtml);
                    const msg = (err.responseJSON && err.responseJSON.error) ? err.responseJSON.error : 'Error creating division. Please verify unique name.';
                    alert(msg);
                }
            });
        });

        // ─────────────────────────────────────────────────────────────────────
        // SUBDIVISION SEARCH & QUICK CREATE
        // ─────────────────────────────────────────────────────────────────────
        const $subSearchInput = $('#subdivisionSearchInput');
        const $subDropdown = $('#subdivisionDropdown');
        const $subOptionsCard = $('#subdivisionOptionsCard');
        const $subOptionsList = $('#subdivisionOptionsList');
        const $subCreateBox = $('#subdivisionCreateBox');
        const $subCreateLabel = $('#createSubdivisionNameLabel');
        const $subClearBtn = $('#btnClearSubdivision');
        const $selectedSubId = $('#selectedSubdivisionId');

        function filterSubdivisions(query) {
            const q = query.toLowerCase().trim();
            let exactMatchFound = false;
            let matchCount = 0;

            $subOptionsList.find('.subdivision-option').each(function() {
                const name = $(this).data('name').toString();
                const nameLower = name.toLowerCase();

                if (nameLower === q) {
                    exactMatchFound = true;
                }

                if (!q || nameLower.includes(q)) {
                    $(this).removeClass('hidden');
                    matchCount++;
                } else {
                    $(this).addClass('hidden');
                }
            });

            if (!q) {
                $subOptionsCard.removeClass('hidden');
                $subOptionsList.find('.subdivision-option').removeClass('hidden');
                $subCreateBox.addClass('hidden');
                return;
            }

            if (matchCount === 0) {
                $subOptionsList.find('.subdivision-option').removeClass('hidden');
                $subOptionsCard.removeClass('hidden');
                $subCreateBox.removeClass('hidden');
                $subCreateLabel.text(query.trim());
            } else if (!exactMatchFound) {
                $subOptionsCard.removeClass('hidden');
                $subCreateBox.removeClass('hidden');
                $subCreateLabel.text(query.trim());
            } else {
                $subOptionsCard.removeClass('hidden');
                $subCreateBox.addClass('hidden');
            }
        }

        $subSearchInput.on('focus input click', function() {
            if ($(this).prop('disabled')) return;
            const val = $(this).val();
            filterSubdivisions(val);
            $('#subdivisionControlWrapper').addClass('z-50');
            $subDropdown.removeClass('hidden');
            $subClearBtn.toggleClass('hidden', !val);
        });

        $subSearchInput.on('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!$subCreateBox.hasClass('hidden')) {
                    $('#btnQuickCreateSubdivision').trigger('click');
                } else {
                    const $first = $subOptionsList.find('.subdivision-option:not(.hidden)').first();
                    if ($first.length) {
                        $first.trigger('click');
                    }
                }
            }
        });

        $(document).on('click', function(e) {
            if (!$(e.target).closest('#subdivisionControlWrapper').length) {
                $subDropdown.addClass('hidden');
                $('#subdivisionControlWrapper').removeClass('z-50');
            }
        });

        $(document).on('click', '.subdivision-option', function(e) {
            e.stopPropagation();
            const id = $(this).data('id');
            const name = $(this).data('name');
            selectSubdivision(id, name);
        });

        $subClearBtn.on('click', function(e) {
            e.stopPropagation();
            $subSearchInput.val('').focus();
            $selectedSubId.val('');
            $subClearBtn.addClass('hidden');
            filterSubdivisions('');
            // Reset Section
            $secSearchInput.val('').prop('disabled', true).attr('placeholder', 'Select a subdivision first');
            $selectedSecId.val('');
            $secClearBtn.addClass('hidden');
            $secOptionsList.html('<p class="text-[12.5px] text-[#9D9C9A] p-2 text-center">Select a subdivision first</p>');
            $secCreateBox.addClass('hidden');
        });

        function selectSubdivision(id, name) {
            $subSearchInput.val(name);
            $selectedSubId.val(id);
            $subDropdown.addClass('hidden');
            $('#subdivisionControlWrapper').removeClass('z-50');
            $subClearBtn.removeClass('hidden');
            $subSearchInput.removeClass('input-error');
            $subSearchInput.closest('div').find('.field-error-text').remove();
            loadSections(id);
        }

        // Quick Create Subdivision via AJAX
        $('#btnQuickCreateSubdivision').on('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const divId = $('#selectedDivisionId').val();
            if (!divId) {
                alert('Please select or create a Division first.');
                $('#divisionSearchInput').focus();
                return;
            }

            const newName = $subCreateLabel.text().trim() || $subSearchInput.val().trim();
            if (!newName) return;

            const $btn = $(this);
            const originalHtml = $btn.html();
            $btn.prop('disabled', true).html(`
                <svg class="animate-spin w-4 h-4 text-[#0B7A44]" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                <span>Creating "${newName}"...</span>
            `);

            $.ajax({
                url: "{% url 'backend:quick_create_subdivision' %}",
                method: "POST",
                data: {
                    division_id: divId,
                    name: newName,
                    csrfmiddlewaretoken: '{{ csrf_token }}'
                },
                success: function(resp) {
                    $btn.prop('disabled', false).html(originalHtml);
                    if (resp.success) {
                        const $existing = $subOptionsList.find(`.subdivision-option[data-id="${resp.id}"]`);
                        if (!$existing.length) {
                            const newOption = `<div class="subdivision-option px-3.5 py-2.5 text-[13.5px] text-[#4A4947] bg-[#F8F8F8] hover:bg-[#EFEFEF] hover:text-[#2B2823] rounded-[9px] cursor-pointer font-medium transition-colors" data-id="${resp.id}" data-name="${resp.name}">${resp.name}</div>`;
                            if ($subOptionsList.find('.subdivision-option').length === 0) {
                                $subOptionsList.empty();
                            }
                            $subOptionsList.prepend(newOption);
                        }
                        selectSubdivision(resp.id, resp.name);
                        showNotificationToast(`Subdivision "${resp.name}" created and selected!`);
                    } else {
                        alert(resp.error || 'Error creating subdivision.');
                    }
                },
                error: function(err) {
                    $btn.prop('disabled', false).html(originalHtml);
                    const msg = (err.responseJSON && err.responseJSON.error) ? err.responseJSON.error : 'Error creating subdivision. Please verify unique name.';
                    alert(msg);
                }
            });
        });

        // Subdivisions & Sections Cascading
        function loadSubdivisions(divisionId) {
            $subSearchInput.val('').prop('disabled', true).attr('placeholder', 'Loading subdivisions...');
            $selectedSubId.val('');
            $subClearBtn.addClass('hidden');
            $subOptionsList.html('<p class="text-[12.5px] text-[#9D9C9A] p-2 text-center">Loading subdivisions...</p>');
            $subCreateBox.addClass('hidden');

            $secSearchInput.val('').prop('disabled', true).attr('placeholder', 'Select a subdivision first');
            $selectedSecId.val('');
            $secClearBtn.addClass('hidden');
            $secOptionsList.html('<p class="text-[12.5px] text-[#9D9C9A] p-2 text-center">Select a subdivision first</p>');
            $secCreateBox.addClass('hidden');

            $.ajax({
                url: "{% url 'backend:get_division_subdivisions' %}",
                data: { division_id: divisionId },
                dataType: 'json',
                success: function(data) {
                    $subSearchInput.prop('disabled', false).attr('placeholder', 'Search subdivision...');
                    let html = '';
                    if (data.subdivisions && data.subdivisions.length) {
                        data.subdivisions.forEach(function(item) {
                            html += `<div class="subdivision-option px-3.5 py-2.5 text-[13.5px] text-[#4A4947] bg-[#F8F8F8] hover:bg-[#EFEFEF] hover:text-[#2B2823] rounded-[9px] cursor-pointer font-medium transition-colors" data-id="${item.id}" data-name="${item.name}">${item.name}</div>`;
                        });
                    } else {
                        html = '<p class="text-[12.5px] text-[#9D9C9A] p-2 text-center">No subdivisions recorded for this division yet.</p>';
                    }
                    $subOptionsList.html(html);
                },
                error: function() {
                    $subSearchInput.prop('disabled', false).attr('placeholder', 'Search subdivision...');
                    $subOptionsList.html('<p class="text-[12.5px] text-[#9D9C9A] p-2 text-center">No subdivisions recorded yet.</p>');
                }
            });
        }

        // ─────────────────────────────────────────────────────────────────────
        // SECTION SEARCH & QUICK CREATE
        // ─────────────────────────────────────────────────────────────────────
        const $secSearchInput = $('#sectionSearchInput');
        const $secDropdown = $('#sectionDropdown');
        const $secOptionsCard = $('#sectionOptionsCard');
        const $secOptionsList = $('#sectionOptionsList');
        const $secCreateBox = $('#sectionCreateBox');
        const $secCreateLabel = $('#createSectionNameLabel');
        const $secClearBtn = $('#btnClearSection');
        const $selectedSecId = $('#selectedSectionId');

        function filterSections(query) {
            const q = query.toLowerCase().trim();
            let exactMatchFound = false;
            let matchCount = 0;

            $secOptionsList.find('.section-option').each(function() {
                const name = $(this).data('name').toString();
                const nameLower = name.toLowerCase();

                if (nameLower === q) {
                    exactMatchFound = true;
                }

                if (!q || nameLower.includes(q)) {
                    $(this).removeClass('hidden');
                    matchCount++;
                } else {
                    $(this).addClass('hidden');
                }
            });

            if (!q) {
                $secOptionsCard.removeClass('hidden');
                $secOptionsList.find('.section-option').removeClass('hidden');
                $secCreateBox.addClass('hidden');
                return;
            }

            if (matchCount === 0) {
                $secOptionsList.find('.section-option').removeClass('hidden');
                $secOptionsCard.removeClass('hidden');
                $secCreateBox.removeClass('hidden');
                $secCreateLabel.text(query.trim());
            } else if (!exactMatchFound) {
                $secOptionsCard.removeClass('hidden');
                $secCreateBox.removeClass('hidden');
                $secCreateLabel.text(query.trim());
            } else {
                $secOptionsCard.removeClass('hidden');
                $secCreateBox.addClass('hidden');
            }
        }

        $secSearchInput.on('focus input click', function() {
            if ($(this).prop('disabled')) return;
            const val = $(this).val();
            filterSections(val);
            $('#sectionControlWrapper').addClass('z-50');
            $secDropdown.removeClass('hidden');
            $secClearBtn.toggleClass('hidden', !val);
        });

        $secSearchInput.on('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!$secCreateBox.hasClass('hidden')) {
                    $('#btnQuickCreateSection').trigger('click');
                } else {
                    const $first = $secOptionsList.find('.section-option:not(.hidden)').first();
                    if ($first.length) {
                        $first.trigger('click');
                    }
                }
            }
        });

        $(document).on('click', function(e) {
            if (!$(e.target).closest('#sectionControlWrapper').length) {
                $secDropdown.addClass('hidden');
                $('#sectionControlWrapper').removeClass('z-50');
            }
        });

        $(document).on('click', '.section-option', function(e) {
            e.stopPropagation();
            const id = $(this).data('id');
            const name = $(this).data('name');
            selectSection(id, name);
        });

        $secClearBtn.on('click', function(e) {
            e.stopPropagation();
            $secSearchInput.val('').focus();
            $selectedSecId.val('');
            $secClearBtn.addClass('hidden');
            filterSections('');
        });

        function selectSection(id, name) {
            $secSearchInput.val(name);
            $selectedSecId.val(id);
            $secDropdown.addClass('hidden');
            $('#sectionControlWrapper').removeClass('z-50');
            $secClearBtn.removeClass('hidden');
            $secSearchInput.removeClass('input-error');
            $secSearchInput.closest('div').find('.field-error-text').remove();
        }

        // Quick Create Section via AJAX
        $('#btnQuickCreateSection').on('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const subId = $('#selectedSubdivisionId').val();
            if (!subId) {
                alert('Please select or create a Subdivision first.');
                $('#subdivisionSearchInput').focus();
                return;
            }

            const newName = $secCreateLabel.text().trim() || $secSearchInput.val().trim();
            if (!newName) return;

            const $btn = $(this);
            const originalHtml = $btn.html();
            $btn.prop('disabled', true).html(`
                <svg class="animate-spin w-4 h-4 text-[#0B7A44]" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                <span>Creating "${newName}"...</span>
            `);

            $.ajax({
                url: "{% url 'backend:quick_create_section' %}",
                method: "POST",
                data: {
                    subdivision_id: subId,
                    name: newName,
                    csrfmiddlewaretoken: '{{ csrf_token }}'
                },
                success: function(resp) {
                    $btn.prop('disabled', false).html(originalHtml);
                    if (resp.success) {
                        const $existing = $secOptionsList.find(`.section-option[data-id="${resp.id}"]`);
                        if (!$existing.length) {
                            const newOption = `<div class="section-option px-3.5 py-2.5 text-[13.5px] text-[#4A4947] bg-[#F8F8F8] hover:bg-[#EFEFEF] hover:text-[#2B2823] rounded-[9px] cursor-pointer font-medium transition-colors" data-id="${resp.id}" data-name="${resp.name}">${resp.name}</div>`;
                            if ($secOptionsList.find('.section-option').length === 0) {
                                $secOptionsList.empty();
                            }
                            $secOptionsList.prepend(newOption);
                        }
                        selectSection(resp.id, resp.name);
                        showNotificationToast(`Section "${resp.name}" created and selected!`);
                    } else {
                        alert(resp.error || 'Error creating section.');
                    }
                },
                error: function(err) {
                    $btn.prop('disabled', false).html(originalHtml);
                    const msg = (err.responseJSON && err.responseJSON.error) ? err.responseJSON.error : 'Error creating section. Please verify unique name.';
                    alert(msg);
                }
            });
        });

        function loadSections(subdivisionId) {
            $secSearchInput.val('').prop('disabled', true).attr('placeholder', 'Loading sections...');
            $selectedSecId.val('');
            $secClearBtn.addClass('hidden');
            $secOptionsList.html('<p class="text-[12.5px] text-[#9D9C9A] p-2 text-center">Loading sections...</p>');
            $secCreateBox.addClass('hidden');

            $.ajax({
                url: "{% url 'backend:get_subdivision_sections' %}",
                data: { subdivision_id: subdivisionId },
                dataType: 'json',
                success: function(data) {
                    $secSearchInput.prop('disabled', false).attr('placeholder', 'Search section...');
                    let html = '';
                    if (data.sections && data.sections.length) {
                        data.sections.forEach(function(item) {
                            html += `<div class="section-option px-3.5 py-2.5 text-[13.5px] text-[#4A4947] bg-[#F8F8F8] hover:bg-[#EFEFEF] hover:text-[#2B2823] rounded-[9px] cursor-pointer font-medium transition-colors" data-id="${item.id}" data-name="${item.name}">${item.name}</div>`;
                        });
                    } else {
                        html = '<p class="text-[12.5px] text-[#9D9C9A] p-2 text-center">No sections recorded for this subdivision yet.</p>';
                    }
                    $secOptionsList.html(html);
                },
                error: function() {
                    $secSearchInput.prop('disabled', false).attr('placeholder', 'Search section...');
                    $secOptionsList.html('<p class="text-[12.5px] text-[#9D9C9A] p-2 text-center">No sections recorded yet.</p>');
                }
            });
        }
    });

    // ─────────────────────────────────────────────────────────────────────────
    // EQUIPMENT DIRECTORY MULTI-SELECT POPUP MODAL (UNASSIGNED ONLY)
    // ─────────────────────────────────────────────────────────────────────────
    const DIRECTORY_EQUIPMENTS = {{ directory_equipments_json|default:'[]'|safe }};
    let modalSelectedEquipments = new Map(); // key -> item object
    let currentFilteredEquipments = [];

    function openEquipmentModal() {
        // Sync working selection map with current addedEquipments
        modalSelectedEquipments.clear();
        addedEquipments.forEach(eq => {
            const key = eq.id ? String(eq.id) : eq.equipment_id;
            modalSelectedEquipments.set(key, Object.assign({}, eq));
        });

        // Update locked building name banner
        const bldName = ($('#inputBuildingName').val() || '').trim() || ($('#inputBuildingId').val() || '').trim() || 'New Building';
        $('#modalBuildingNameDisplay').text(bldName);

        // Reset search & filters
        $('#modalDirectorySearchInput').val('');
        $('#btnModalSearchClear').addClass('hidden');
        $('#modalDirectoryTypeFilter').val('');

        renderDirectoryList();
        updateModalFooterCount();

        $('#addEquipmentModal').removeClass('hidden');
        $('body').addClass('overflow-hidden');
        setTimeout(() => $('#modalDirectorySearchInput').focus(), 50);
    }

    function closeEquipmentModal() {
        $('#addEquipmentModal').addClass('hidden');
        $('body').removeClass('overflow-hidden');
    }

    // Close popup on Escape key
    $(document).on('keydown', function(e) {
        if (e.key === 'Escape' && !$('#addEquipmentModal').hasClass('hidden')) {
            closeEquipmentModal();
        }
    });

    function clearModalSearch() {
        $('#modalDirectorySearchInput').val('').focus();
        $('#btnModalSearchClear').addClass('hidden');
        renderDirectoryList();
    }

    // Filter events
    $(document).on('input', '#modalDirectorySearchInput', function() {
        const val = $(this).val();
        $('#btnModalSearchClear').toggleClass('hidden', !val);
        renderDirectoryList();
    });

    $(document).on('change', '#modalDirectoryTypeFilter', function() {
        renderDirectoryList();
    });

    function renderDirectoryList() {
        const q = ($('#modalDirectorySearchInput').val() || '').toLowerCase().trim();
        const selectedType = $('#modalDirectoryTypeFilter').val();

        currentFilteredEquipments = DIRECTORY_EQUIPMENTS.filter(eq => {
            // Only show unassigned equipment
            if (!eq.is_unassigned) {
                return false;
            }
            if (selectedType && String(eq.equipment_type_id) !== String(selectedType)) {
                return false;
            }
            if (q) {
                const idMatch = (eq.equipment_id || '').toLowerCase().includes(q);
                const nameMatch = (eq.equipment_name || '').toLowerCase().includes(q);
                const brandMatch = (eq.brand || '').toLowerCase().includes(q);
                const modelMatch = (eq.model_number || '').toLowerCase().includes(q);
                const serialMatch = (eq.serial_number || '').toLowerCase().includes(q);
                const typeMatch = (eq.equipment_type_name || '').toLowerCase().includes(q);
                if (!idMatch && !nameMatch && !brandMatch && !modelMatch && !serialMatch && !typeMatch) {
                    return false;
                }
            }
            return true;
        });

        const $container = $('#modalDirectoryListContainer');
        if (currentFilteredEquipments.length === 0) {
            $container.html(`
                <div class="bg-white rounded-[10px] border border-[#EAEAE9] py-8 px-4 text-center">
                    <p class="text-[13.5px] font-semibold text-[#2B2823] mb-1">No unassigned equipment found</p>
                    <p class="text-[12px] text-[#716F6C]">Try adjusting your search or equipment type filter.</p>
                </div>
            `);
            updateModalFooterCount();
            return;
        }

        let html = '';
        currentFilteredEquipments.forEach(eq => {
            const key = eq.id ? String(eq.id) : eq.equipment_id;
            const isSelected = modalSelectedEquipments.has(key);

            const cardBorderClass = isSelected ? 'border-[#0B7A44] bg-[#F7FBF8]' : 'border-[#EAEAE9] bg-white';
            const checkBgClass = isSelected ? 'bg-[#0B7A44] border-[#0B7A44]' : 'bg-white border-[#D0D0CE]';
            const checkIcon = isSelected ? `<svg class="w-3 h-3 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>` : '';

            html += `
                <div class="equipment-directory-card p-3 rounded-[10px] border ${cardBorderClass} shadow-[0_1px_2px_rgba(0,0,0,0.02)] hover:border-[#0B7A44] transition-all cursor-pointer select-none flex items-start gap-3"
                     onclick="toggleDirectoryEquipment('${key}')">
                    <div class="w-5 h-5 rounded-[5px] border ${checkBgClass} flex items-center justify-center shrink-0 mt-0.5 transition-colors">
                        ${checkIcon}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between gap-2 flex-wrap">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="bld-mono font-bold text-[13px] text-[#2B2823]">${eq.equipment_id}</span>
                                <span class="font-semibold text-[13px] text-[#2B2823] truncate max-w-[180px]">${eq.equipment_name || ''}</span>
                                <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-[#F0F0F0] text-[#5C5B59]">${eq.equipment_type_name}</span>
                            </div>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-[#E7F6EC] text-[#0B7A44]">Unassigned</span>
                        </div>
                        <div class="flex items-center gap-3 text-[12px] text-[#716F6C] mt-1 flex-wrap">
                            ${eq.brand ? `<span>Brand: <strong class="text-[#4A4947] font-medium">${eq.brand}</strong></span>` : ''}
                            ${eq.model_number ? `<span>Model: <strong class="text-[#4A4947] font-medium">${eq.model_number}</strong></span>` : ''}
                            ${eq.floor_location ? `<span class="inline-flex items-center gap-1 text-[#0B7A44]">📍 ${eq.floor_location}</span>` : ''}
                        </div>
                    </div>
                </div>
            `;
        });

        $container.html(html);
        updateModalFooterCount();
    }

    function toggleDirectoryEquipment(key) {
        if (modalSelectedEquipments.has(key)) {
            modalSelectedEquipments.delete(key);
        } else {
            const item = DIRECTORY_EQUIPMENTS.find(eq => (eq.id ? String(eq.id) : eq.equipment_id) === key);
            if (item) {
                modalSelectedEquipments.set(key, Object.assign({}, item));
            }
        }
        renderDirectoryList();
    }

    function updateModalFooterCount() {
        $('#btnModalApplyCountBadge').text(modalSelectedEquipments.size);
    }

    function applyModalSelection() {
        addedEquipments = Array.from(modalSelectedEquipments.values());
        renderEquipmentList();
        closeEquipmentModal();
        if (addedEquipments.length > 0) {
            showNotificationToast(`Assigned ${addedEquipments.length} equipment to building.`);
        }
    }

    function removeEquipment(index) {
        const removed = addedEquipments.splice(index, 1)[0];
        if (removed) {
            const key = removed.id ? String(removed.id) : removed.equipment_id;
            modalSelectedEquipments.delete(key);
        }
        renderEquipmentList();
    }

    function renderEquipmentList() {
        $('#equipmentsDataJson').val(JSON.stringify(addedEquipments));
        const count = addedEquipments.length;
        $('#addedEquipmentCount').text(count);

        if (count === 0) {
            $('#equipmentEmptyState').removeClass('hidden');
            $('#equipmentPopulatedState').addClass('hidden');
        } else {
            $('#equipmentEmptyState').addClass('hidden');
            $('#equipmentPopulatedState').removeClass('hidden');

            let html = '';
            addedEquipments.forEach((eq, idx) => {
                html += `
                    <div class="flex items-center justify-between p-3.5 rounded-[12px] border border-[#EAEAE9] bg-white shadow-[0_1px_3px_rgba(0,0,0,0.03)] hover:border-[#D0D0CE] transition-all">
                        <div class="flex items-start gap-3">
                            <div class="w-8 h-8 rounded-full bg-[#E7F6EC] flex items-center justify-center text-[#0B7A44] shrink-0 mt-0.5">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                                </svg>
                            </div>
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="bld-mono font-bold text-[13.5px] text-[#2B2823]">${eq.equipment_id}</span>
                                    <span class="font-semibold text-[13px] text-[#2B2823]">${eq.equipment_name || ''}</span>
                                    <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-[#F0F0F0] text-[#5C5B59]">${eq.equipment_type_name || 'Equipment'}</span>
                                </div>
                                <div class="flex items-center gap-3 text-[12px] text-[#716F6C] mt-1 flex-wrap">
                                    ${eq.brand ? `<span>Brand: <strong class="text-[#4A4947] font-medium">${eq.brand}</strong></span>` : ''}
                                    ${eq.model_number ? `<span>Model: <strong class="text-[#4A4947] font-medium">${eq.model_number}</strong></span>` : ''}
                                    ${eq.floor_location ? `<span class="inline-flex items-center gap-1 text-[#0B7A44] bg-[#E7F6EC] px-2 py-0.2 rounded-full font-medium">📍 ${eq.floor_location}</span>` : '<span class="text-[#9D9C9A]">Location not set</span>'}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <button type="button"
                                    onclick="removeEquipment(${idx})"
                                    title="Remove from this building"
                                    class="p-1.5 text-[#9D9C9A] hover:text-[#D93025] hover:bg-[#FEE2E2] rounded-lg transition-colors">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            });
            $('#equipmentListContainer').html(html);
        }
        updateReviewSummary();
    }

    // ─────────────────────────────────────────────────────────────────────────
    // STEP 3: REVIEW SUMMARY POPULATION
    // ─────────────────────────────────────────────────────────────────────────
    function updateReviewSummary() {
        $('#reviewBuildingId').text($('#inputBuildingId').val() || '----');
        $('#reviewBuildingName').text($('#inputBuildingName').val() || '----');
        $('#reviewSiteName').text($('#inputSiteName').val() || '----');

        const subText = $('#subdivisionSearchInput').val();
        $('#reviewSubdivision').text(subText || '----');

        const secText = $('#sectionSearchInput').val();
        $('#reviewSection').text(secText || '----');

        $('#reviewAddress').text($('#inputAddress').val() || '----');
        $('#reviewLatitude').text($('#inputLatitude').val() || '----');
        $('#reviewLongitude').text($('#inputLongitude').val() || '---');

        const eqCount = addedEquipments.length;
        if (eqCount === 0) {
            $('#equipmentSummaryCard').addClass('hidden');
        } else {
            $('#equipmentSummaryCard').removeClass('hidden');
            $('#reviewEquipmentBadge').text(eqCount);

            let html = '';
            addedEquipments.forEach((eq) => {
                html += `
                    <div class="flex items-center justify-between p-2.5 rounded-[8px] bg-[#FAFAFA] border border-[#EAEAE9] text-[12.5px]">
                        <div class="flex items-center gap-2">
                            <span class="bld-mono font-semibold text-[#2B2823]">${eq.equipment_id}</span>
                            <span class="text-[#716F6C] font-normal">• ${eq.equipment_name || eq.equipment_type_name}</span>
                        </div>
                        <span class="text-[#716F6C]">${eq.brand || eq.floor_location || ''}</span>
                    </div>
                `;
            });
            $('#reviewEquipmentListBox').html(html);
        }
    }
</script>
