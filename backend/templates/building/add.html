{% extends 'base.html' %}
{% block title %}{{ action }} Building{% endblock %}
{% block content %}
<section class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex items-center gap-4 mb-6">
            <a href="{% url 'backend:building_list' %}" class="text-gray-600 hover:text-gray-900">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </a>
            <h2 class="text-2xl font-bold text-gray-900">{{ action }} Building</h2>
        </div>

        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            
            <!-- Basic & General Info -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <h3 class="text-lg font-bold text-gray-900 mb-4 pb-2 border-b border-gray-100">Basic & General Info</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Building Name <span class="text-red-500">*</span></label>
                        <input type="text" name="name" value="{{ obj.name|default:'' }}" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none" required placeholder="e.g. Tower A">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Nickname</label>
                        <input type="text" name="nickname" value="{{ obj.nickname|default:'' }}" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none" placeholder="e.g. North Wing">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Division</label>
                        <select name="division" class="w-full bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none">
                            <option value="">Select Division</option>
                            {% for d in divisions %}
                                <option value="{{ d.id }}" {% if obj.division_id == d.id %}selected{% endif %}>{{ d.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Sub-Division</label>
                        <select name="subdivision" class="w-full bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none">
                            <option value="">Select Sub-Division</option>
                            {% for s in subdivisions %}
                                <option value="{{ s.id }}" {% if obj.subdivision_id == s.id %}selected{% endif %}>{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Section</label>
                        <select name="section" class="w-full bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none">
                            <option value="">Select Section</option>
                            {% for s in sections %}
                                <option value="{{ s.id }}" {% if obj.section_id == s.id %}selected{% endif %}>{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <!-- Location Data -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <div class="flex items-center gap-2 mb-4 pb-2 border-b border-gray-100">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <h3 class="text-lg font-bold text-gray-900">Location Data</h3>
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Address</label>
                    <input type="text" name="address" value="{{ obj.address|default:'' }}" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none" placeholder="e.g. 123 Main St, City, Country">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Latitude</label>
                        <input type="number" step="any" name="latitude" value="{{ obj.latitude|default:'' }}" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none" placeholder="e.g. 3.1415">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Longitude</label>
                        <input type="number" step="any" name="longitude" value="{{ obj.longitude|default:'' }}" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none" placeholder="e.g. 101.6865">
                    </div>
                </div>
            </div>

            <!-- Status & Details -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                <h3 class="text-lg font-bold text-gray-400 uppercase tracking-wider mb-4 pb-2 border-b border-gray-100">Status & Details</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Status</label>
                        <select name="status" class="w-full bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none">
                            <option value="Active" {% if obj.status == 'Active' %}selected{% endif %}>Active</option>
                            <option value="Inactive" {% if obj.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                            <option value="Under Maintenance" {% if obj.status == 'Under Maintenance' %}selected{% endif %}>Under Maintenance</option>
                            <option value="Decommissioned" {% if obj.status == 'Decommissioned' %}selected{% endif %}>Decommissioned</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Installation Year</label>
                        <input type="number" name="installation_year" value="{{ obj.installation_year|default:'' }}" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none" placeholder="e.g. 2020">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Building Image</label>
                    {% if obj.image %}
                        <div class="mb-3">
                            <img src="{{ obj.image.url }}" alt="{{ obj.name }}" class="h-24 w-24 object-cover rounded-md border border-gray-200">
                        </div>
                    {% endif %}
                    <input type="file" name="image" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2 outline-none cursor-pointer">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Notes</label>
                    <textarea name="notes" rows="3" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none" placeholder="Any additional information...">{{ obj.notes|default:'' }}</textarea>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="flex items-center gap-4 mt-6 pb-8">
                <button type="submit" class="flex-1 md:flex-none md:w-64 bg-[#3B5998] hover:bg-blue-800 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 ease-in-out text-center">
                    Save Building
                </button>
                <a href="{% url 'backend:building_list' %}" class="flex-1 md:flex-none bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-semibold py-3 px-6 rounded-lg transition duration-200 ease-in-out text-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
