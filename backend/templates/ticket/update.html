{% extends 'base.html' %}
{% block title %}{{ action }} Ticket{% endblock %}
{% block content %}
    <section class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans">
        <div class="max-w-4xl mx-auto">
            <!-- Header -->
            <div class="flex items-center gap-4 mb-6">
                <a href="{% url 'backend:ticket_list' %}"
                   class="text-gray-600 hover:text-gray-900">
                    <svg width="24"
                         height="24"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">
                        <path d="M15 18l-6-6 6-6" />
                    </svg>
                </a>
                <h2 class="text-2xl font-bold text-gray-900">{{ action }} Ticket #{{ obj.id }}</h2>
            </div>
            <form method="post" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h3 class="text-lg font-bold text-gray-900 mb-6 border-b border-gray-100 pb-2">Ticket Details</h3>
                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Title <span class="text-red-500">*</span></label>
                        <input type="text"
                               name="title"
                               value="{{ obj.title|default:'' }}"
                               class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none"
                               required
                               placeholder="Short description of the issue">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Equipment <span class="text-red-500">*</span></label>
                            <select name="equipment_id"
                                    class="w-full bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none"
                                    required>
                                <option value="">Select Equipment</option>
                                {% for e in equipments %}
                                    <option value="{{ e.id }}"
                                            {% if obj.equipment_id == e.id %}selected{% endif %}>{{ e.equipment_id }} - {{ e.equipment_type.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Building <span class="text-red-500">*</span></label>
                            <select name="building_id"
                                    class="w-full bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none"
                                    required>
                                <option value="">Select Building</option>
                                {% for b in buildings %}
                                    <option value="{{ b.id }}"
                                            {% if obj.building_id == b.id %}selected{% endif %}>[{{ b.id }}] — {{ b.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Issue Type</label>
                            <select name="issue_type"
                                    class="w-full bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none">
                                <option value="breakdown"
                                        {% if obj.issue_type == 'breakdown' %}selected{% endif %}>Breakdown</option>
                                <option value="routine"
                                        {% if obj.issue_type == 'routine' %}selected{% endif %}>Routine Check</option>
                                <option value="emergency"
                                        {% if obj.issue_type == 'emergency' %}selected{% endif %}>Emergency</option>
                                <option value="inspection"
                                        {% if obj.issue_type == 'inspection' %}selected{% endif %}>Inspection</option>
                                <option value="warranty"
                                        {% if obj.issue_type == 'warranty' %}selected{% endif %}>Warranty</option>
                                <option value="other" {% if obj.issue_type == 'other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Priority</label>
                            <select name="priority"
                                    class="w-full bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none">
                                <option value="low" {% if obj.priority == 'low' %}selected{% endif %}>Low</option>
                                <option value="medium" {% if obj.priority == 'medium' %}selected{% endif %}>Medium</option>
                                <option value="high" {% if obj.priority == 'high' %}selected{% endif %}>High</option>
                                <option value="critical"
                                        {% if obj.priority == 'critical' %}selected{% endif %}>Critical</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Status</label>
                        <select name="status"
                                class="w-full bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none">
                            <option value="open" {% if obj.status == 'open' %}selected{% endif %}>Open</option>
                            <option value="assigned" {% if obj.status == 'assigned' %}selected{% endif %}>Assigned</option>
                            <option value="in_progress"
                                    {% if obj.status == 'in_progress' %}selected{% endif %}>In Progress</option>
                            <option value="resolved" {% if obj.status == 'resolved' %}selected{% endif %}>Resolved</option>
                            <option value="closed" {% if obj.status == 'closed' %}selected{% endif %}>Closed</option>
                            <option value="rejected" {% if obj.status == 'rejected' %}selected{% endif %}>Rejected</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
                        <textarea name="issue_description"
                                  rows="4"
                                  class="w-full bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none"
                                  placeholder="Provide details about the issue...">{{ obj.issue_description|default:'' }}</textarea>
                    </div>
                </div>
                <!-- Form Actions -->
                <div class="flex items-center gap-4 mt-6 pb-8">
                    <button type="submit"
                            class="flex-1 md:flex-none md:w-64 bg-[#3B5998] hover:bg-blue-800 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 ease-in-out text-center">
                        Save Changes
                    </button>
                    <a href="{% url 'backend:ticket_list' %}"
                       class="flex-1 md:flex-none bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-semibold py-3 px-6 rounded-lg transition duration-200 ease-in-out text-center">
                        Cancel
                    </a>
                    <!-- <div class="ml-auto bg-[#3B5998] ">
                    <button type="button" onclick="if(confirm('Are you sure you want to change status?')) { document.getElementById('status-form').submit(); }" class="{% if obj.is_active %}text-red-500  hover:text-red-700{% else %}text-green-500 hover:text-green-700{% endif %} font-semibold py-3 px-4 transition duration-200 text-sm">
                        {% if obj.is_active %}Make Inactive{% else %}Make Active{% endif %}
                    </button>
                </div> -->
                </div>
            </form>
            <form id="status-form"
                  action="{% url 'backend:ticket_status' obj.id %}"
                  method="post"
                  style="display: none">
                {% csrf_token %}
            </form>
        </div>
    </section>
{% endblock %}
{% block extra_js %}
    <script>
  $(document).ready(function () {
    $('.select2-items').select2();
  });
    </script>
{% endblock %}
