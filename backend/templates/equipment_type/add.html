{% extends 'base.html' %}
{% block title %}Add Equipment Type{% endblock %}
{% block content %}
<section class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-3xl mx-auto">
        <div class="flex items-center gap-4 mb-6">
            <a href="{% url 'backend:equipment_type_list' %}" class="text-gray-600 hover:text-gray-900">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <h2 class="text-2xl font-bold text-gray-900">Add Equipment Type</h2>
        </div>

        <form method="post" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            {% csrf_token %}
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Name <span class="text-red-500">*</span></label>
                <input type="text" name="name" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none" required placeholder="e.g. Lift">
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
                <textarea name="description" rows="4" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none" placeholder="Provide a brief description..."></textarea>
            </div>

            <div class="flex items-center gap-4 mt-6">
                <button type="submit" class="bg-[#3B5998] hover:bg-blue-800 text-white font-semibold py-2.5 px-6 rounded-lg transition duration-200">Save</button>
                <a href="{% url 'backend:equipment_type_list' %}" class="bg-white border border-gray-200 text-gray-700 font-semibold py-2.5 px-6 rounded-lg transition duration-200 hover:bg-gray-50">Cancel</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
{% block extra_js %}
<script>
  $(document).ready(function () {
    $('.select2-items').select2();
  });
<script>
{% endblock %}
